<!-- ── Health-check loader ─────────────────────────────────────────────── -->
@if (loading()) {
  <app-loader />
}

<!-- ── App shell — rendered once health check passes ─────────────────── -->
@if (!loading()) {
  <div class="min-h-screen">

    <!-- Layout chrome -->
    <app-announcement-bar />
    <app-header />

    <!-- Page sections -->
    <main>
      <app-hero />
      <app-marquee />
      <app-categories />
      <app-promo-banner />
      <app-shop />
      <app-custom-order-banner />
      <app-occasions />
      <app-reviews />
      <app-newsletter />
    </main>

    <app-footer />

    <!-- Overlays -->
    <app-mobile-nav />
    <app-cart />
    <app-quick-view />
    <app-custom-order-modal />

    <!-- Global toast -->
    <app-toast />

  </div>
}
