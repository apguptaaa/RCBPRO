<header class="sticky top-0 z-40 border-b border-cocoa/10 bg-cream/95 backdrop-blur-xl">
  <div class="mx-auto flex h-20 max-w-7xl items-center gap-5 px-4 sm:px-6 lg:px-8">

    <!-- Mobile menu trigger -->
    <button
      class="rounded-full p-2 text-cocoa xl:hidden"
      (click)="store.mobileOpen.set(true)"
      aria-label="Open menu">
      <svg lucideMenu [size]="25"></svg>
    </button>

    <!-- Logo -->
    <a routerLink="/" class="mr-auto flex shrink-0 items-center gap-2 lg:mr-4">
      <span class="grid h-11 w-11 place-items-center rounded-full border border-cocoa/20 bg-cocoa text-cream">
        <svg lucideCakeSlice [size]="23" [strokeWidth]="1.7"></svg>
      </span>
      <span>
        <strong class="block font-display text-xl leading-none text-espresso sm:text-2xl">Crumb &amp; Bloom</strong>
        <!-- <strong class="block font-display text-xl leading-none text-espresso sm:text-2xl">Royal Cake Bakery</strong> -->
        <small class="hidden text-[9px] font-bold uppercase tracking-[.28em] text-caramel sm:block">Bakery &amp; Florals</small>
      </span>
    </a>

    <!-- Desktop nav links -->
    <nav class="hidden items-center gap-4 text-xs font-semibold xl:flex 2xl:gap-6 2xl:text-sm" aria-label="Main navigation">
      <a routerLink="/" routerLinkActive="text-caramel" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" class="whitespace-nowrap transition hover:text-caramel">Home</a>
      <a routerLink="/cakes" routerLinkActive="text-caramel" ariaCurrentWhenActive="page" class="whitespace-nowrap transition hover:text-caramel">Cakes</a>
      <a routerLink="/best-sellers" routerLinkActive="text-caramel" ariaCurrentWhenActive="page" class="whitespace-nowrap transition hover:text-caramel">Best Sellers</a>
      <a routerLink="/occasions" routerLinkActive="text-caramel" ariaCurrentWhenActive="page" class="whitespace-nowrap transition hover:text-caramel">Occasions</a>
      <a routerLink="/customize" routerLinkActive="text-caramel" ariaCurrentWhenActive="page" class="whitespace-nowrap transition hover:text-caramel">Customize</a>
    </nav>

    <!-- Location picker — desktop xl+ -->
    <div class="hidden items-center gap-2 rounded-full border border-cocoa/10 bg-white/60 px-3 py-2 xl:flex">
      <svg lucideMapPin [size]="16" [class]="'text-caramel'"></svg>
      <span class="text-xs font-semibold">Gwalior delivery</span>
    </div>

    <!-- Icon actions -->
    <div class="flex items-center gap-1 sm:gap-2">

      <!-- Account menu -->
      <div class="relative">
        <button
          (click)="toggleAccountMenu($event)"
          class="rounded-full p-2.5 transition hover:bg-sand/60"
          aria-label="Account"
          [attr.aria-expanded]="accountMenuOpen()"
          aria-haspopup="dialog">
          <svg lucideUserRound [size]="21"></svg>
        </button>
        @if (accountMenuOpen()) {
          <section
            (click)="$event.stopPropagation()"
            class="absolute right-0 top-full z-50 mt-3 w-[min(20rem,calc(100vw-2rem))] rounded-2xl border border-cocoa/10 bg-cream p-5 text-left shadow-2xl"
            role="dialog"
            aria-label="Account welcome">
            <span class="text-[10px] font-bold uppercase tracking-[.2em] text-caramel">Crumb &amp; Bloom account</span>
            <h2 class="mt-2 font-display text-2xl font-bold text-espresso">Welcome</h2>
            <p class="mt-1 text-sm leading-5 text-cocoa/60">
              {{ adminAuth.user() ? 'Signed in as ' + adminAuth.user()?.email : 'Sign in to keep track of your orders and favourite cakes.' }}
            </p>
            <button
              (click)="adminAuth.user() ? signOut() : openLogin()"
              class="mt-4 w-full rounded-xl bg-cocoa px-4 py-3 text-sm font-bold text-cream transition hover:bg-espresso">
              {{ adminAuth.user() ? 'Sign out' : 'Login / Sign up' }}
            </button>
          </section>
        }
      </div>

      <!-- Wishlist -->
      <button
        (click)="navigateToFavorites()"
        class="relative rounded-full p-2.5 transition hover:bg-sand/60"
        aria-label="Favourites">
        <svg lucideHeart [size]="21"></svg>
        @if (store.wishlist().length > 0) {
          <span class="absolute right-0 top-0 grid h-5 min-w-5 place-items-center rounded-full bg-caramel px-1 text-[10px] font-bold text-white">
            {{ store.wishlist().length }}
          </span>
        }
      </button>

      <!-- Cart -->
      <button
        (click)="store.cartOpen.set(true)"
        class="relative rounded-full p-2.5 transition hover:bg-sand/60"
        aria-label="Shopping bag">
        <svg lucideShoppingBag [size]="21"></svg>
        @if (store.cartCount() > 0) {
          <span class="absolute right-0 top-0 grid h-5 min-w-5 place-items-center rounded-full bg-cocoa px-1 text-[10px] font-bold text-white">
            {{ store.cartCount() }}
          </span>
        }
      </button>

    </div>
  </div>
</header>
