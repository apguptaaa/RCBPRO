<section class="mx-auto max-w-7xl px-4 py-20 sm:px-6 lg:px-8">
  <div class="grid overflow-hidden rounded-[2rem] bg-cocoa text-cream shadow-soft lg:grid-cols-2">

    <!-- Photo -->
    <div class="min-h-[420px] overflow-hidden">
      <img
        src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?auto=format&fit=crop&w=1200&q=90"
        alt="Cake artist decorating a custom cake"
        class="h-full w-full object-cover" />
    </div>

    <!-- Copy -->
    <div class="grain flex items-center p-7 sm:p-12 lg:p-16">
      <div>
        <span class="text-xs font-bold uppercase tracking-[.22em] text-rosebeige">Designed by you</span>
        <h2 class="mt-3 font-display text-4xl font-bold leading-tight sm:text-5xl">
          A cake as unique as your celebration.
        </h2>
        <p class="mt-5 max-w-xl leading-7 text-cream/70">
          Choose your flavour, size, colour palette, message and theme. Our cake artists will turn your idea into an edible centrepiece.
        </p>

        <div class="mt-7 grid gap-3 sm:grid-cols-2">
          @for (item of features; track item) {
            <div class="flex items-center gap-2 text-sm font-semibold">
              <span class="grid h-6 w-6 place-items-center rounded-full bg-cream/10">
                <svg lucideCheck [size]="14"></svg>
              </span>
              {{ item }}
            </div>
          }
        </div>

        <button
          (click)="store.customOpen.set(true)"
          class="mt-9 inline-flex items-center gap-2 rounded-full bg-cream px-6 py-3.5 text-sm font-bold text-cocoa transition hover:bg-sand">
          Start customizing
          <svg lucideArrowRight [size]="17"></svg>
        </button>
      </div>
    </div>

  </div>
</section>
