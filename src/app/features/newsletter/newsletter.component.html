<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8">
  <div class="grid gap-8 rounded-[2rem] border border-cocoa/10 bg-cream/80 p-7 shadow-card sm:p-10 lg:grid-cols-[1fr_auto] lg:items-center">

    <div>
      <h2 class="font-display text-3xl font-bold text-espresso">
        Sweet notes, seasonal menus and special offers.
      </h2>
      <p class="mt-2 text-sm text-cocoa/60">Join our table. We send only the good stuff.</p>
    </div>

    <form
      (submit)="onSubmit($event)"
      class="flex flex-col gap-2 sm:flex-row">
      <input
        type="email"
        name="email"
        required
        maxlength="254"
        placeholder="Your email address"
        class="min-w-0 rounded-xl border border-cocoa/15 bg-white px-4 py-3.5 text-sm outline-none focus:border-caramel sm:w-72" />
      <button
        type="submit"
        class="rounded-xl bg-cocoa px-6 py-3.5 text-sm font-bold text-cream transition hover:bg-espresso">
        Subscribe
      </button>
    </form>

  </div>
</section>
