<section id="occasions" class="pb-20">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">

    <div class="text-center">
      <span class="text-xs font-bold uppercase tracking-[.22em] text-caramel">Gifts that feel personal</span>
      <h2 class="mt-2 font-display text-4xl font-bold text-espresso sm:text-5xl">Shop by occasion</h2>
    </div>

    <div class="mt-10 grid gap-5 md:grid-cols-3">
      @for (occasion of occasions; track occasion.title; let i = $index) {
        <button
          (click)="pick(i)"
          class="group relative min-h-[410px] overflow-hidden rounded-[1.7rem] text-left shadow-card">
          <img
            [src]="occasion.image"
            [alt]="occasion.title"
            class="absolute inset-0 h-full w-full object-cover transition duration-700 group-hover:scale-110" />
          <div class="absolute inset-0 bg-gradient-to-t from-espresso/90 via-cocoa/15 to-transparent"></div>
          <div class="absolute inset-x-0 bottom-0 p-6 text-cream">
            <h3 class="font-display text-3xl font-bold">{{ occasion.title }}</h3>
            <p class="mt-1 text-sm text-cream/70">{{ occasion.note }}</p>
            <span class="mt-5 inline-flex items-center gap-2 text-sm font-bold">
              Explore gifts
              <svg lucideArrowRight [size]="17" [class]="'transition group-hover:translate-x-1'"></svg>
            </span>
          </div>
        </button>
      }
    </div>

  </div>
</section>
