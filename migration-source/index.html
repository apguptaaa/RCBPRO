    :root {

      --caramel: #a86f45;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--cocoa);
      background:
        radial-gradient(circle at 1px 1px, rgba(58, 36, 27, .075) 1px, transparent 1.1px),
        #f7f0e5;
      background-size: 24px 24px;
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    body.no-scroll {
      overflow: hidden;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    img {
      display: block;
    }

    .grain {
      position: relative;
      isolation: isolate;
    }

    .grain::after {
      content: "";
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: .24;
      background-image:
        linear-gradient(45deg, transparent 48%, rgba(255,255,255,.25) 49%, transparent 52%),
        linear-gradient(-45deg, transparent 48%, rgba(255,255,255,.15) 49%, transparent 52%);
      background-size: 35px 35px;
    }

    .hero-blob {
      animation: float 6s ease-in-out infinite;
    }

    .hero-blob-secondary {
      animation: float 7s ease-in-out infinite reverse;
    }

    .reveal {
      animation: reveal .65s ease both;
    }

    .product-card {
      transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
    }

    .product-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 24px 55px rgba(58, 36, 27, .14);
      border-color: rgba(168, 111, 69, .35);
    }

    .product-card img {
      transition: transform .6s cubic-bezier(.2,.7,.2,1);
    }

    .product-card:hover img {
      transform: scale(1.07);
    }

    .hide-scrollbar {
      scrollbar-width: none;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .marquee-track {
      width: max-content;
      animation: marquee 22s linear infinite;
    }

    .marquee-track:hover {
      animation-play-state: paused;
    }

    .cart-panel {
      animation: slideIn .32s ease both;
    }

    .modal-card {
      animation: modalUp .3s ease both;
    }

    .toast {
      animation: toastIn .35s ease both;
    }

    .line-clamp-1 {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-14px) rotate(1deg); }
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes marquee {
      to { transform: translateX(-50%); }
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes modalUp {
      from { opacity: 0; transform: translateY(20px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

                    <div className="space-y-5">
                      {cart.map(item => (
                        <div key={item.id} className="flex gap-4 border-b border-cocoa/10 pb-5">
                          <img src={item.image} alt={item.name} className="h-24 w-24 rounded-xl object-cover" />
                          <div className="min-w-0 flex-1">
                            <h3 className="font-display font-bold leading-tight">{item.name}</h3>
                            <p className="mt-1 text-xs text-cocoa/50">{item.category}</p>
                            <div className="mt-3 flex items-center justify-between">
                              <div className="flex items-center rounded-full border border-cocoa/15">
                                <button onClick={() => updateQuantity(item.id, -1)} className="p-2" aria-label="Decrease quantity"><Icon name="minus" size={14} /></button>
                                <span className="w-7 text-center text-xs font-bold">{item.quantity}</span>
                                <button onClick={() => updateQuantity(item.id, 1)} className="p-2" aria-label="Increase quantity"><Icon name="plus" size={14} /></button>
                              </div>
                              <strong>{formatPrice(item.price * item.quantity)}</strong>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="border-t border-cocoa/10 bg-white/60 p-5 sm:p-6">
                    <div className="flex justify-between text-sm">
                      <span className="text-cocoa/60">Subtotal</span>
                      <strong>{formatPrice(subtotal)}</strong>
                    </div>
                    <div className="mt-2 flex justify-between text-sm">
                      <span className="text-cocoa/60">Delivery</span>
                      <strong className={subtotal >= 999 ? "text-sage" : ""}>{subtotal >= 999 ? "Complimentary" : "₹79"}</strong>
                    </div>
                    <div className="mt-4 flex justify-between border-t border-cocoa/10 pt-4 text-lg">
                      <span className="font-bold">Total</span>
                      <strong>{formatPrice(subtotal + (subtotal >= 999 ? 0 : 79))}</strong>
                    </div>
                    <button
                      onClick={() => setToast("Checkout is ready for payment integration")}
                      className="mt-5 w-full rounded-xl bg-cocoa py-4 text-sm font-bold text-cream transition hover:bg-espresso"
                    >
                      Proceed to checkout
                    </button>
                  </div>
                )}
              </aside>
            </div>
          )}

          {quickView && (
            <div className="fixed inset-0 z-50 grid place-items-center overflow-y-auto bg-espresso/65 p-4 backdrop-blur-sm" onMouseDown={() => setQuickView(null)}>
              <div className="modal-card relative grid w-full max-w-4xl overflow-hidden rounded-3xl bg-cream shadow-2xl md:grid-cols-2" onMouseDown={event => event.stopPropagation()}>
                <button onClick={() => setQuickView(null)} className="absolute right-4 top-4 z-10 grid h-10 w-10 place-items-center rounded-full bg-cream shadow" aria-label="Close">
                  <Icon name="x" size={21} />
                </button>
                <img src={quickView.image} alt={quickView.name} className="h-72 w-full object-cover md:h-full md:min-h-[510px]" />
                <div className="flex flex-col justify-center p-7 sm:p-10">
                  <span className="text-xs font-bold uppercase tracking-[.18em] text-caramel">{quickView.category}</span>
                  <h2 className="mt-3 font-display text-3xl font-bold text-espresso sm:text-4xl">{quickView.name}</h2>
                  <div className="mt-4 flex items-center gap-2">
                    <div className="flex gap-1 text-caramel">
                      {[1,2,3,4,5].map(item => <Icon key={item} name="star" size={15} className="fill-caramel" />)}
                    </div>
                    <span className="text-xs text-cocoa/50">{quickView.rating} · {quickView.reviews} reviews</span>
                  </div>
                  <p className="mt-6 leading-7 text-cocoa/65">{quickView.description}</p>
                  <div className="mt-6 flex items-end gap-3">
                    <strong className="text-2xl">{formatPrice(quickView.price)}</strong>
                    <span className="pb-1 text-sm text-cocoa/40 line-through">{formatPrice(quickView.oldPrice)}</span>
                  </div>
                  <div className="mt-5 rounded-xl bg-sand/40 p-4 text-sm">
                    <div className="flex items-center gap-2 font-semibold"><Icon name="truck" size={18} /> Earliest delivery: Today, 5:00 PM</div>
                  </div>
                  <button
                    onClick={() => { addToCart(quickView); setQuickView(null); }}
                    className="mt-6 flex items-center justify-center gap-2 rounded-xl bg-cocoa px-5 py-4 text-sm font-bold text-cream"
                  >
                    <Icon name="shopping-bag" size={18} /> Add to bag
                  </button>
                </div>
              </div>
            </div>
          )}

          {customOpen && (
            <div className="fixed inset-0 z-50 grid place-items-center overflow-y-auto bg-espresso/65 p-4 backdrop-blur-sm" onMouseDown={() => setCustomOpen(false)}>
              <form
                className="modal-card relative w-full max-w-2xl rounded-3xl bg-cream p-6 shadow-2xl sm:p-9"
                onMouseDown={event => event.stopPropagation()}
                onSubmit={event => {
                  event.preventDefault();
                  setCustomOpen(false);
                  setToast("Your custom cake request has been received");
                }}
              >
                <button type="button" onClick={() => setCustomOpen(false)} className="absolute right-4 top-4 rounded-full p-2 hover:bg-sand" aria-label="Close">
                  <Icon name="x" size={22} />
                </button>

                <span className="text-xs font-bold uppercase tracking-[.2em] text-caramel">Made especially for you</span>
                <h2 className="mt-2 pr-8 font-display text-3xl font-bold text-espresso sm:text-4xl">Design your custom cake</h2>
                <p className="mt-2 text-sm text-cocoa/55">Tell us a little about your celebration. Our cake artist will contact you with ideas and pricing.</p>

                <div className="mt-7 grid gap-4 sm:grid-cols-2">
                  <label className="text-sm font-bold">
                    Occasion
                    <select required className="mt-2 w-full rounded-xl border border-cocoa/15 bg-white px-4 py-3 font-normal outline-none focus:border-caramel">
                      <option>Birthday</option>
                      <option>Anniversary</option>
                      <option>Wedding</option>
                      <option>Baby shower</option>
                      <option>Other</option>
                    </select>
                  </label>
                  <label className="text-sm font-bold">
                    Preferred flavour
                    <select required className="mt-2 w-full rounded-xl border border-cocoa/15 bg-white px-4 py-3 font-normal outline-none focus:border-caramel">
                      <option>Belgian chocolate</option>
                      <option>Vanilla berry</option>
                      <option>Red velvet</option>
                      <option>Butterscotch</option>
                      <option>Fresh fruit</option>
                    </select>
                  </label>
                  <label className="text-sm font-bold">
                    Serving size
                    <select required className="mt-2 w-full rounded-xl border border-cocoa/15 bg-white px-4 py-3 font-normal outline-none focus:border-caramel">
                      <option>6–8 people</option>
                      <option>10–15 people</option>
                      <option>20–30 people</option>
                      <option>30+ people</option>
                    </select>
                  </label>
                  <label className="text-sm font-bold">
                    Celebration date
                    <input type="date" required className="mt-2 w-full rounded-xl border border-cocoa/15 bg-white px-4 py-3 font-normal outline-none focus:border-caramel" />
                  </label>
                </div>

                <label className="mt-4 block text-sm font-bold">
                  Your design idea
                  <textarea
                    required
                    rows="3"
                    placeholder="Theme, colours, message, references or any special details..."
                    className="mt-2 w-full resize-none rounded-xl border border-cocoa/15 bg-white px-4 py-3 font-normal outline-none focus:border-caramel"
                  ></textarea>
                </label>

                <button className="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-cocoa px-5 py-4 text-sm font-bold text-cream">
                  Request a consultation <Icon name="arrow-right" size={17} />
                </button>
              </form>
            </div>
          )}

          {toast && (
            <div className="toast fixed bottom-5 left-1/2 z-[70] flex -translate-x-1/2 items-center gap-3 rounded-full bg-espresso px-5 py-3 text-sm font-semibold text-cream shadow-2xl">
              <span className="grid h-6 w-6 place-items-center rounded-full bg-cream/15"><Icon name="check" size={15} /></span>
              <span className="max-w-[240px]">{toast}</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
